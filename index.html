<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nextline Music Studio</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1b1a18;--mute:#6b665e;--line:#e2dcd2;--acc:#d9480f;--accink:#fff;--ok:#2b8a3e;--bad:#c92a2a;--dis:#ece7de}
@media (prefers-color-scheme:dark){:root{--bg:#141311;--card:#1f1d1a;--ink:#f3efe8;--mute:#a09a8f;--line:#35322d;--acc:#ff922b;--accink:#1b1a18;--ok:#69db7c;--bad:#ff8787;--dis:#2a2723}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:960px;margin:0 auto;padding:18px 16px 8px}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:-.02em}.logo span{color:var(--acc)}
nav{display:flex;gap:6px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
main{max-width:960px;margin:0 auto;padding:8px 16px 48px}
.hero h1{margin:12px 0 4px;font-size:1.8rem;letter-spacing:-.02em}.hero p{margin:0;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:70px}.full{grid-column:1/-1}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slot{padding:9px 4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.slot.sel{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.slot:disabled{background:var(--dis);color:var(--mute);text-decoration:line-through;cursor:not-allowed}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--bad);border:1px solid var(--line);padding:6px 12px;font-size:.85rem;font-weight:600}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px}
.msg.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.msg.err{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.mute{color:var(--mute);font-size:.9rem}
.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stat b{display:block;font-size:1.6rem}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:top}
th{color:var(--mute);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--dis);font-size:.8rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.bar>div{flex:1;min-width:150px}
</style>
</head>
<body>
<header>
  <div class="logo">Next<span>line</span></div>
</header>
<main>
<section id="pb">
  <div class="hero"><h1>Book the studio</h1><p>No account needed. Pick a date and time, and you're in.</p></div>
  <div class="card">
    <div class="grid">
      <div><label for="n">Name</label><input id="n" autocomplete="name"></div>
      <div><label for="c">Contact number</label><input id="c" type="tel" autocomplete="tel"></div>
      <div class="full"><label for="e">Email</label><input id="e" type="email" autocomplete="email"></div>
      <div><label for="d">Date</label><input id="d" type="date"></div>
      <div><label for="u">Duration</label><select id="u"><option value="1">1 hour</option><option value="2">2 hours</option><option value="3">3 hours</option><option value="4">4 hours</option></select></div>
      <div class="full"><label>Start time <span class="mute">(greyed out = already booked)</span></label><div class="slots" id="slots"></div></div>
      <div class="full"><label for="x">Extras</label><select id="x"><option>None</option><option>Piano</option><option>Double Pedals</option><option>Both</option></select></div>
      <div class="full"><label for="t">Notes (optional)</label><textarea id="t"></textarea></div>
    </div>
    <p style="margin:16px 0 0"><button class="btn" id="go">Book session</button></p>
    <div id="bm"></div>
  </div>
</section>
<section id="pa" hidden>
  <div class="hero"><h1>Bookings</h1><p>Everyone who has booked the studio.</p><p><a href="#" style="color:var(--acc)">← Back to booking page</a></p></div>
  <div class="card" id="lg"><div class="bar"><div><label for="pin">Admin PIN</label><input id="pin" type="password" autocomplete="current-password"></div><div><button class="btn" id="li">Sign in</button></div></div><div id="am"></div></div>
  <div id="ac" hidden>
    <div class="stats" id="st" style="margin-top:16px"></div>
    <div class="card">
      <div class="bar"><div><label for="fd">Filter by date</label><input id="fd" type="date"></div><div><label for="fq">Search name</label><input id="fq"></div></div>
      <div class="tbl" style="margin-top:12px"><table><thead><tr><th>Date</th><th>Time</th><th>Name</th><th>Contact</th><th>Email</th><th>Extras</th><th>Notes</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
      <p class="mute" id="empty" hidden>No bookings found.</p>
    </div>
  </div>
</section>
</main>
<script>
const API_URL = "PASTE_YOUR_WEB_APP_URL_HERE";   // <-- from Google Apps Script (see setup steps)
const OPEN = 10, CLOSE = 22;

const $=id=>document.getElementById(id);
const fmt=h=>(h%12||12)+":00 "+(h<12||h===24?"AM":"PM");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
let taken=new Set(),start=null,bookings=[],pin=sessionStorage.getItem("nl_pin")||"";
const ready=!API_URL.startsWith("PASTE");

function route(){const a=location.hash==="#admin";$("pb").hidden=a;$("pa").hidden=!a;if(a&&pin)loadAdmin()}
window.addEventListener("hashchange",route);
const msg=(el,t,k)=>$(el).innerHTML=t?'<div class="msg '+k+'">'+esc(t)+'</div>':"";
const api=(q)=>fetch(API_URL+"?"+new URLSearchParams(q)).then(r=>r.json());

$("d").min=$("d").value=today();
const fits=(h,len)=>{for(let i=0;i<len;i++){if(h+i>=CLOSE||taken.has(h+i))return false}return true};
function drawSlots(){
  const len=+$("u").value,box=$("slots");box.innerHTML="";
  for(let h=OPEN;h<CLOSE;h++){
    const b=document.createElement("button");b.type="button";b.className="slot"+(start===h?" sel":"");
    b.textContent=fmt(h);b.disabled=!fits(h,len);b.onclick=()=>{start=h;drawSlots()};box.appendChild(b);
  }
  if(start!==null&&!fits(start,len))start=null;
}
async function loadDay(){
  start=null;taken=new Set();drawSlots();
  if(!ready||!$("d").value)return;
  try{const r=await api({action:"slots",date:$("d").value});taken=new Set(r.taken||[]);drawSlots()}catch(e){msg("bm","Could not load availability. Please refresh.","err")}
}
$("d").onchange=loadDay;$("u").onchange=drawSlots;

$("go").onclick=async()=>{
  msg("bm","");
  if(!ready)return msg("bm","This site isn't connected yet (API URL missing).","err");
  const v={name:$("n").value.trim(),contact:$("c").value.trim(),email:$("e").value.trim(),date:$("d").value,start,hours:+$("u").value,extras:$("x").value,notes:$("t").value.trim()};
  if(!v.name||!v.contact||!v.email)return msg("bm","Please enter your name, contact number and email.","err");
  if(!/^\S+@\S+\.\S+$/.test(v.email))return msg("bm","Please enter a valid email.","err");
  if(!v.date||start===null)return msg("bm","Please pick a date and a start time.","err");
  $("go").disabled=true;
  try{
    const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(v)}).then(r=>r.json());
    if(r.error)msg("bm",r.error,"err");
    else{msg("bm","You're booked, "+v.name+"! "+v.date+" at "+fmt(v.start)+" for "+v.hours+" hour"+(v.hours>1?"s":"")+". See you at Nextline.","ok");
      ["n","c","e","t"].forEach(i=>$(i).value="");$("x").value="None"}
    loadDay();
  }catch(e){msg("bm","Could not send your booking. Please try again.","err")}
  $("go").disabled=false;
};

function renderAdmin(){
  const fd=$("fd").value,q=$("fq").value.toLowerCase(),t=today();
  const list=bookings.filter(b=>(!fd||b.date===fd)&&(!q||b.name.toLowerCase().includes(q)))
    .sort((a,b)=>(a.date+String(a.start).padStart(2,"0")).localeCompare(b.date+String(b.start).padStart(2,"0")));
  $("st").innerHTML='<div class="stat"><b>'+bookings.length+'</b><span class="mute">Total</span></div><div class="stat"><b>'+bookings.filter(b=>b.date>=t).length+'</b><span class="mute">Upcoming</span></div><div class="stat"><b>'+bookings.filter(b=>b.date===t).length+'</b><span class="mute">Today</span></div>';
  $("rows").innerHTML=list.map(b=>'<tr><td>'+esc(b.date)+'</td><td>'+fmt(b.start)+' – '+fmt(b.start+b.hours)+'<br><span class="mute">'+b.hours+' hr</span></td><td><b>'+esc(b.name)+'</b></td><td>'+esc(b.contact)+'</td><td>'+esc(b.email)+'</td><td><span class="tag">'+esc(b.extras)+'</span></td><td>'+esc(b.notes)+'</td><td><button class="btn ghost" data-id="'+esc(b.id)+'">Cancel</button></td></tr>').join("");
  $("empty").hidden=list.length>0;
  $("rows").querySelectorAll("button").forEach(btn=>btn.onclick=async()=>{
    const b=bookings.find(x=>x.id===btn.dataset.id);if(!b||!confirm("Cancel booking for "+b.name+"?"))return;
    await api({action:"cancel",pin,id:b.id});loadAdmin();loadDay();
  });
}
async function loadAdmin(){
  if(!ready)return msg("am","Site isn't connected yet (API URL missing).","err");
  try{
    const r=await api({action:"list",pin});
    if(r.error){sessionStorage.removeItem("nl_pin");pin="";$("lg").hidden=false;$("ac").hidden=true;return msg("am","Wrong PIN.","err")}
    bookings=r.bookings;$("lg").hidden=true;$("ac").hidden=false;renderAdmin();
  }catch(e){msg("am","Could not load bookings.","err")}
}
$("li").onclick=()=>{pin=$("pin").value;sessionStorage.setItem("nl_pin",pin);loadAdmin()};
$("fd").oninput=$("fq").oninput=renderAdmin;
drawSlots();loadDay();route();
</script>
</body>
</html>
